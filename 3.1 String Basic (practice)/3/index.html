<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевод в верхний регистр</title>
</head>
<body>
    

    <script>
        // - Пусть пользователь введёт любое слово
        // - Выведи это слово в **верхнем регистре**

        let name = prompt("Введите ваше имя: ")
        
        // проверка если пользователь ничего не введет..

        if(name) {
            console.log(name.toUpperCase())

            document.write("Вы ввели строку, это строка в верхнем регистре - ", name.toUpperCase(),"<br>")
            console.log(`Имя в верхнем регистре: ${name.toUpperCase()}`)

            document.write("Вы ввели строку, это строка в нижнем регистре - ", name.toLowerCase(),"<br>")
            console.log(`Имя в нижнем регистре: ${name.toLowerCase()}`)
        } else {
            document.write("Вы ничего не ввели...")
        }
    </script>

</body>
</html>
