<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевод в верхний регистр</title>
</head>
<body>
    

    <script>
        // - Пусть пользователь введёт любое слово
        // - Выведи это слово в **верхнем регистре**

        let name = prompt("Введите ваше имя: ")
        console.log(name.toUpperCase())
        document.write(name.toUpperCase())
    </script>
</body>
</html>
