<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевод в верхний регистр</title>
</head>
<body>
    

    <script>
        // - Пусть пользователь введёт любое слово
        // - Выведи это слово в **верхнем регистре**

        let name = prompt("Введите ваше имя: ")
        
        // проверка если пользователь ничего не введет..

        if(name && name.trim()) {

            // Создаем вверхний регистр вывода информации

            const upperText = document.createElement("p")
            upperText.textContent = `Вы ввели строку, это строка в верхнем регистре: ${name.toUpperCase()}`

            // Создаем нижний регистр вывода информации

            const lowerText = document.createElement("p")
            lowerText.textContent = `Вы ввели строку, это строка в нижнем регистре: ${name.toLowerCase()}`

            // вывод 

            document.body.append(upperText, lowerText)

            // Выводим информацию на консоль 

            console.log(`Вы ввели строку, это строка в верхнем регистре: ${name.toUpperCase()}`)


            //console.log(name.toUpperCase())
            //document.body.textContent = `Вы ввели строку, это строка в верхнем регистре ${name.toUpperCase()}`
            //document.write("Вы ввели строку, это строка в верхнем регистре - ", name.toUpperCase(),"<br>")
            //console.log(`Имя в верхнем регистре: ${name.toUpperCase()}`)


            // Устаревший способ не использовать!!
            // document.write("Вы ничего не ввели...") 
            // Актуальный способ
            //document.body.textContent = `Вы ввели строку, это строка в нижнем регистре ${name.toLowerCase()}`
            //console.log(`Имя в нижнем регистре: ${name.toLowerCase()}`)
        } else {
            // Устаревший способ не использовать!!
            // document.write("Вы ничего не ввели...") 
            // Актуальный способ
            document.body.textContent = `Вы ничего не ввели...`
            console.log("Вы ничего не ввели...")
        }
    </script>

</body>
</html>
